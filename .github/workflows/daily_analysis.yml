name: 📊 일별 퀀트 분석

on:
  # 매일 오전 8시 30분 KST (UTC 23:30 전날) — 한국 장 시작 30분 전
  schedule:
    - cron: "30 23 * * 0-4"   # 일~목 UTC 23:30 = 월~금 KST 08:30

  # 미국 장 시작 30분 전 (UTC 13:30)
  # 필요하면 아래 주석 해제
  # - cron: "30 13 * * 1-5"

  # 수동 실행 (GitHub Actions 탭에서 버튼 클릭)
  workflow_dispatch:
    inputs:
      reason:
        description: "실행 사유 (선택)"
        required: false
        default: "수동 실행"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 리포트를 레포에 커밋하기 위해 필요

    steps:
      # 1. 코드 체크아웃
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. 의존성 설치
      - name: 📦 의존성 설치
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy pyarrow requests

      # 4. 분석 실행
      - name: 🔍 분석 실행
        env:
          KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
          KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
        run: python run_analysis.py

      # 5. 결과를 레포에 커밋
      - name: 💾 리포트 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git add -f reports/md/
          git diff --staged --quiet || git commit -m "📊 일별 분석 리포트: $(date +'%Y-%m-%d')"
          git push origin main